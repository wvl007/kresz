<!DOCTYPE html>
<html>
    <head>
        <title>KRESZ teszt</title>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta property="og:site_name" content="KRESZ teszt" />
        <meta property="og:description" content="Gyakorolj a megújult KRESZ tesztre okosan! Regisztráció nélkül, akár mobilról is." />
        <!-- React -->
        <script src="assets/react-0.13.3.min.js"></script>
        <!-- JQuery -->
        <script src="assets/jquery-2.1.4.min.js"></script>
        <link rel="stylesheet" href="assets/materialize.min.css">
        <link href="assets/material-icons.css" rel="stylesheet">
        <script src="assets/materialize.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
        <!-- PWA beállítások -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#00897b">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="KRESZ Teszt">
        <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
        <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
        <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
        <!-- Preload categories -->
        <script>
            window.callbackcategories = function(data) {
                window.callbackcategories_data = data;
            };
        </script>
        <script src="data/jsonp/categories.js"></script>
        <!-- Own code -->
        <link href="style.css" rel="stylesheet">
        <script src="model.js"></script>
        <script src="ui.compiled.js"></script>
    </head>
    <body>
        <div id="content" class=""></div>

        <script type="text/javascript">
            React.render(
                React.createElement(App),
                document.getElementById('content')
            );

            // Kényszerített frissítés a menüből vagy Infó oldalról
            window.forceAppUpdate = function() {
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(function(name) { return caches.delete(name); }));
                    }).then(function() {
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.getRegistrations().then(function(regs) {
                                return Promise.all(regs.map(function(r) { return r.unregister(); }));
                            }).then(function() {
                                window.location.reload(true);
                            });
                        } else {
                            window.location.reload(true);
                        }
                    }).catch(function() {
                        window.location.reload(true);
                    });
                } else {
                    window.location.reload(true);
                }
            };

            // Progressive Web App Service Worker regisztráció
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg) {
                        reg.update();
                    }).catch(function(err) {
                        console.log('SW regisztrációs hiba:', err);
                    });
                });
            }
        </script>
    </body>
</html>

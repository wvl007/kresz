<!DOCTYPE html>
<html>
    <head>
        <title>KRESZ teszt</title>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta property="og:site_name" content="KRESZ teszt" />
        <meta property="og:description" content="Gyakorolj a megújult KRESZ tesztre okosan! Regisztráció nélkül, akár mobilról is." />
        <!-- React -->
        <script src="assets/react-0.13.3.min.js"></script>
        <!-- JQuery -->
        <script src="assets/jquery-2.1.4.min.js"></script>
        <link rel="stylesheet" href="assets/materialize.min.css">
        <link href="assets/material-icons.css" rel="stylesheet">
        <script src="assets/materialize.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
        <!-- PWA beállítások -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#00897b">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="KRESZ Teszt">
        <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
        <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
        <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
        <!-- Preload categories -->
        <script>
            window.callbackcategories = function(data) {
                window.callbackcategories_data = data;
            };
        </script>
        <script src="data/jsonp/categories.js"></script>
        <!-- Own code -->
        <link href="style.css" rel="stylesheet">
        <script src="model.js"></script>
        <script src="ui.compiled.js"></script>
    </head>
    <body>
        <div id="content" class=""></div>

        <script type="text/javascript">
            React.render(
                React.createElement(App),
                document.getElementById('content')
            );

            // Kényszerített azonnali frissítés segédfüggvény (törli az összes cache-t és újratölt)
            window.forceAppUpdate = function() {
                var btn = document.getElementById('pwa-update-btn');
                if (btn) btn.textContent = 'Frissítés folyamatban...';
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(function(name) { return caches.delete(name); }));
                    }).then(function() {
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.getRegistrations().then(function(regs) {
                                return Promise.all(regs.map(function(r) { return r.unregister(); }));
                            }).then(function() {
                                window.location.reload(true);
                            });
                        } else {
                            window.location.reload(true);
                        }
                    }).catch(function() {
                        window.location.reload(true);
                    });
                } else {
                    window.location.reload(true);
                }
            };

            function showUpdateNotification() {
                if (document.getElementById('pwa-update-banner')) return;
                var banner = document.createElement('div');
                banner.id = 'pwa-update-banner';
                banner.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 999999; background: #1e293b; color: #ffffff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 12px; font-family: sans-serif; font-size: 14px;';
                banner.innerHTML = '<span>🚀 Új verzió érhető el!</span>' +
                    '<button id="pwa-update-btn" style="background: #00897b; border: none; color: #fff; padding: 6px 14px; border-radius: 5px; font-weight: 600; cursor: pointer;">Frissítés most</button>' +
                    '<button id="pwa-update-close" style="background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 0 4px;">✕</button>';
                document.body.appendChild(banner);

                document.getElementById('pwa-update-btn').onclick = function() {
                    window.forceAppUpdate();
                };
                document.getElementById('pwa-update-close').onclick = function() {
                    banner.remove();
                };
            }

            // Progressive Web App Service Worker regisztráció és automata frissítés
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js?v=' + Date.now(), { updateViaCache: 'none' }).then(function(reg) {
                        console.log('KRESZ PWA Service Worker aktív:', reg.scope);

                        // Ha már várakozik egy új service worker a háttérben
                        if (reg.waiting) {
                            showUpdateNotification();
                        }

                        // Ha frissítés közben új service worker érkezik
                        reg.addEventListener('updatefound', function() {
                            var newWorker = reg.installing;
                            if (!newWorker) return;
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showUpdateNotification();
                                }
                            });
                        });

                        // Azonnali frissítéskeresés indításkor
                        reg.update();
                    }).catch(function(err) {
                        console.log('KRESZ PWA Service Worker hiba:', err);
                    });

                    // Ha a háttérben aktiválódott az új service worker, automatikusan frissítjük a nézetet
                    var refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', function() {
                        if (!refreshing) {
                            refreshing = true;
                            window.location.reload();
                        }
                    });
                });
            }
        </script>
    </body>
</html>
